name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s test -p 'test_release.py'
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.0-dev
